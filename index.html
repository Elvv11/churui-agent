<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贴片机行业情报助手 v3 · 团队共享版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;height:100vh;display:flex;background:#f7f7f8;color:#1a1a2e}

/* ====== 左侧侧边栏：白底黑字 ====== */
.sidebar{width:260px;background:#fff;border-right:1px solid #e5e5e5;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;font-size:13px;color:#1a1a2e}
.sidebar .user-box{padding:14px;border-bottom:1px solid #eee}
.sidebar .user-box input{width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;font-family:inherit;outline:none;color:#1a1a2e}
.sidebar .user-box input:focus{border-color:#1a1a2e}
.sidebar .user-box .uname{font-size:12px;color:#666;margin-top:4px}
.sidebar h3{font-size:11px;color:#999;padding:12px 14px 4px;text-transform:uppercase;letter-spacing:.03em}
.sidebar .stat{display:flex;justify-content:space-between;padding:6px 14px;font-size:12px;color:#333;cursor:pointer}
.sidebar .stat:hover{background:#f5f5f5}
.sidebar .stat span:last-child{font-weight:600;color:#1a1a2e}
.sidebar .btn-sm{display:block;width:calc(100% - 28px);margin:3px 14px;padding:6px 0;border-radius:6px;border:1px solid #ddd;background:#fff;color:#333;font-size:11px;cursor:pointer;text-align:center}
.sidebar .btn-sm:hover{background:#f5f5f5}
.sidebar .btn-sm.danger{color:#e03131;border-color:#e03131}
.sidebar .btn-sm.danger:hover{background:#fff5f5}
.fact-list{flex:1;overflow-y:auto;padding:0 10px}
.fact-item{font-size:11px;color:#444;padding:5px 4px;border-bottom:1px solid #f0f0f0;line-height:1.5}
.cat-tag{cursor:pointer;font-size:10px;padding:2px 7px;background:#eee;color:#555;border-radius:10px;display:inline-block;margin:2px}
.cat-tag.cat-active,.cat-tag:hover{background:#1a1a2e;color:#fff}
.fact-item .who{color:#1a1a2e;font-weight:600}

/* ====== 主区域 ====== */
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:#fff}
.topbar{background:#fff;border-bottom:1px solid #eee;padding:10px 20px;display:flex;align-items:center;gap:10px;flex-shrink:0;min-height:46px}
.topbar h1{font-size:15px;color:#1a1a2e;font-weight:600}
.topbar .sub{font-size:10px;color:#999;margin-left:auto}
.topbar .daily-btn{padding:5px 12px;background:#1a1a2e;color:#fff;border:none;border-radius:5px;font-size:11px;cursor:pointer}
.topbar .daily-btn:hover{background:#333}
.topbar .daily-btn:disabled{background:#ccc;cursor:not-allowed}
.topbar .status{font-size:10px;color:#40c057;display:flex;align-items:center;gap:4px}
.topbar .status .dot{width:5px;height:5px;border-radius:50%;background:#40c057}

/* ====== 聊天区 ====== */
.chat-wrap{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:20px;max-width:800px;width:100%;margin:0 auto}
.msg{display:flex;gap:10px;max-width:100%}
.msg.user{flex-direction:row-reverse}
.msg .avatar{width:30px;height:30px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.msg.assistant .avatar{background:#f0f0f0;color:#555}
.msg.user .avatar{background:#1a1a2e;color:#fff;border-radius:4px}
.msg .bubble{max-width:80%;padding:0 0 0 0;font-size:14px;line-height:1.75;color:#1a1a2e}
.msg.assistant .bubble{padding:0 4px}
.msg.user .bubble{background:#1a1a2e;color:#fff;padding:10px 16px;border-radius:12px 12px 4px 12px}
.msg .bubble h2{font-size:15px;color:#e8590c;margin:10px 0 4px;font-weight:600}
.msg .bubble h3{font-size:14px;color:#1a1a2e;margin:8px 0 4px;font-weight:600}
.msg .bubble strong{color:#e8590c}
.msg .bubble .who-tag{font-size:10px;color:#999;display:block;margin-top:2px}
.msg .bubble table{width:100%;border-collapse:collapse;margin:8px 0;font-size:12px}
.msg .bubble table th{background:#f7f7f8;padding:6px 10px;text-align:left;font-weight:600;color:#1a1a2e;border:1px solid #e5e5e5}
.msg .bubble table td{padding:6px 10px;border:1px solid #e5e5e5;color:#333}
.msg .bubble a{color:#1a1a2e;text-decoration:underline}
.msg .bubble a:hover{color:#555}
.typing .bubble{color:#999;font-size:13px;padding:8px 4px}
.typing .dots span{display:inline-block;width:5px;height:5px;border-radius:50%;background:#ccc;margin:0 2px;animation:dot 1.4s infinite}
.typing .dots span:nth-child(2){animation-delay:.2s}
.typing .dots span:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,60%,100%{opacity:.2}30%{opacity:1}}

/* ====== 输入栏 ====== */
.input-bar{background:#fff;border-top:1px solid #eee;padding:14px 24px;display:flex;gap:10px;flex-shrink:0;align-items:center;max-width:800px;width:100%;margin:0 auto}
.input-bar input{flex:1;padding:10px 16px;border:1.5px solid #e5e5e5;border-radius:10px;font-size:14px;font-family:inherit;outline:none;background:#f7f7f8;color:#1a1a2e}
.input-bar input:focus{border-color:#1a1a2e;background:#fff}
.input-bar button{padding:10px 20px;background:#1a1a2e;color:#fff;border:none;border-radius:10px;font-size:14px;cursor:pointer}
.input-bar button:hover{background:#333}
.input-bar button:disabled{background:#ddd;color:#999;cursor:not-allowed}

/* ====== 建议标签 ====== */
.suggestions{display:flex;gap:6px;flex-wrap:wrap;padding:0 20px 10px;max-width:800px;width:100%;margin:0 auto}
.suggestions span{font-size:11px;padding:4px 10px;background:#f0f0f0;color:#555;border-radius:12px;cursor:pointer}
.suggestions span:hover{background:#ddd}

/* ====== Toast ====== */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:8px 18px;border-radius:16px;font-size:12px;font-weight:600;z-index:999;animation:tIn .3s;box-shadow:0 4px 12px rgba(0,0,0,.15)}
@keyframes tIn{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.toast-ok{background:#1a1a2e;color:#fff}
.toast-err{background:#e03131;color:#fff}

/* ====== 右侧历史面板：白底黑字 ====== */
.history-panel{width:240px;background:#fff;border-left:1px solid #e5e5e5;display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;font-size:12px;color:#1a1a2e}
.history-panel h3{font-size:11px;color:#999;padding:12px 10px 4px;letter-spacing:.03em}
.history-search{padding:5px 10px}
.history-search input{width:100%;padding:6px 8px;border:1px solid #ddd;border-radius:5px;font-size:11px;font-family:inherit;outline:none}
.history-search input:focus{border-color:#1a1a2e}
.history-list{flex:1;overflow-y:auto;padding:0 6px}
.history-item{padding:7px 6px;border-bottom:1px solid #f0f0f0;cursor:pointer;transition:.15s;border-radius:4px}
.history-item:hover{background:#f7f7f8}
.history-item .hi-title{font-size:11px;color:#1a1a2e;line-height:1.4;margin-bottom:2px}
.history-item .hi-meta{font-size:10px;color:#999;display:flex;justify-content:space-between}
.stat-clickable{cursor:pointer}
.stat-clickable:hover{background:#f5f5f5!important;border-radius:4px}

/* ====== 姓名覆盖层 ====== */
.name-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:300;display:flex;align-items:center;justify-content:center}
.name-overlay .name-box{background:#fff;border-radius:12px;padding:30px 24px;width:340px;max-width:90vw;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.name-overlay .name-box h3{font-size:16px;color:#1a1a2e;margin-bottom:4px}
.name-overlay .name-box p{font-size:12px;color:#999;margin-bottom:16px}
.name-overlay .name-box input{width:100%;padding:11px 14px;border:2px solid #e5e5e5;border-radius:8px;font-size:15px;font-family:inherit;outline:none;text-align:center;color:#1a1a2e}
.name-overlay .name-box input:focus{border-color:#1a1a2e}
.name-overlay .name-box button{width:100%;margin-top:12px;padding:10px;background:#1a1a2e;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer}
.name-overlay .name-box button:hover{background:#333}

/* ====== 响应式 ====== */
@media(max-width:768px){
  .sidebar{display:none}
  .history-panel{display:none}
  .chat-wrap{padding:16px}
  .input-bar{padding:12px 16px}
  .topbar{padding:10px 16px}
}
@media(max-width:1000px){.history-panel{display:none}}
</style>
</head>

<script>
// ====== Supabase 配置 ======
const SUPABASE_URL = 'https://fiqdpidddzamqtxgmhhv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_b7IywEMyKonprW6BTAYh7Q_6ucx39eo';

// ====== DeepSeek ======
// DeepSeek API 密钥已迁移至后端
// API端点已迁移至后端 /api/chat

// ====== SerpAPI (百度搜索引擎) ======
// API 密钥已迁移至后端 Vercel Functions

// ====== v3.4 信源信誉引擎 + 查询缓存 + 时效性检查 ======

// 受信域名白名单（从 knowledge_base.json industryResources 动态构建）
let _trustedDomains = [];

// 额外硬编码的权威来源（券商/行业协会/官方机构/行业媒体）
var HARDCODED_AUTHORITIES = [
  {domain:'cninfo.com.cn', source:'巨潮资讯网(上市公司公告)', label:'高可信'},
  {domain:'csrc.gov.cn', source:'中国证监会', label:'高可信'},
  {domain:'semi.org', source:'SEMI(国际半导体产业协会)', label:'高可信'},
  {domain:'semichina.org', source:'SEMI中国', label:'高可信'},
  {domain:'stats.gov.cn', source:'国家统计局', label:'高可信'},
  {domain:'miit.gov.cn', source:'工信部', label:'高可信'},
  {domain:'cnipa.gov.cn', source:'国家知识产权局', label:'高可信'},
  {domain:'ctbpsp.com', source:'中国招标投标公共服务平台', label:'高可信'},
  {domain:'ccgp.gov.cn', source:'中国政府采购网', label:'高可信'},
  {domain:'qianlima.com', source:'千里马招标网', label:'中等可信'},
  {domain:'smtchina.com', source:'SMT China表面组装技术', label:'高可信'},
  {domain:'chuandong.com', source:'中国传动网', label:'高可信'},
  {domain:'gg-led.com', source:'高工LED', label:'中等可信'},
  {domain:'qcc.com', source:'企查查', label:'中等可信'},
  {domain:'citics.com', source:'中信证券', label:'高可信'},
  {domain:'htsc.com', source:'华泰证券', label:'高可信'},
  {domain:'dwzq.com.cn', source:'东吴证券', label:'高可信'},
  {domain:'hczq.com', source:'华创证券', label:'高可信'},
  {domain:'cindasc.com', source:'信达证券', label:'高可信'},
  {domain:'esmchina.com', source:'国际电子商情', label:'高可信'},
  {domain:'laoyaoba.com', source:'集微网', label:'中等可信'},
  {domain:'eet-china.com', source:'电子工程专辑', label:'中等可信'},
  {domain:'eeworld.com.cn', source:'电子工程世界', label:'中等可信'},
  {domain:'icsmart.cn', source:'芯智讯', label:'中等可信'}
];

function buildTrustedDomains(kb){
  var list = [].concat(HARDCODED_AUTHORITIES);
  try {
    var resources = kb.industryResources;
    if(resources.media){
      resources.media.forEach(function(m){
        if(m.url) list.push({domain: extractDomain(m.url), source: m.name, label:'高可信'});
      });
    }
    if(resources.dataSources){
      resources.dataSources.forEach(function(d){
        if(d.url) list.push({domain: extractDomain(d.url), source: d.name, label:'高可信'});
      });
    }
    if(resources.biddingPlatforms){
      resources.biddingPlatforms.forEach(function(b){
        if(b.url) list.push({domain: extractDomain(b.url), source: b.name, label:'高可信'});
      });
    }
  } catch(e){ console.warn('构建域名白名单失败：'+e.message); }
  _trustedDomains = list;
}

function extractDomain(url){
  try {
    var host = url.replace(/^https?:\/\//,'').replace(/\/.*$/,'').replace(/^www\./,'').toLowerCase();
    return host;
  } catch(e){ return (url||'').toLowerCase(); }
}

function getSourceCredibility(url, title){
  var domain = extractDomain(url||'');
  var match = _trustedDomains.find(function(d){ return domain === d.domain || domain.indexOf(d.domain)>=0 || d.domain.indexOf(domain)>=0; });
  if(match) return {level:'high', label:'高可信', source:match.source, color:'#059669'};
  if(/\.gov\.cn$|\.edu\.cn$|\.org\.cn$/.test(domain)){
    return {level:'medium', label:'中等可信', source:'政府/机构域名', color:'#b45309'};
  }
  if(/36kr|huxiu|geekpark|ifeng|sina|sohu|163\.com|eastmoney|stcn|cls\.cn|yicai/.test(domain)){
    return {level:'medium', label:'中等可信', source:'知名媒体', color:'#b45309'};
  }
  return {level:'low', label:'需核实', source:'未验证来源', color:'#dc2626'};
}

// 查询缓存（localStorage，24小时有效期）
var CACHE_TTL = 24 * 60 * 60 * 1000;

function getSearchCache(query){
  try {
    var raw = localStorage.getItem('agent3_search_cache');
    if(!raw) return null;
    var cache = JSON.parse(raw);
    var key = query.trim().toLowerCase();
    if(cache[key] && (Date.now() - cache[key].ts) < CACHE_TTL){
      return cache[key].data;
    }
    return null;
  } catch(e){ return null; }
}

function setSearchCache(query, results){
  try {
    var raw = localStorage.getItem('agent3_search_cache');
    var cache = raw ? JSON.parse(raw) : {};
    var now = Date.now();
    Object.keys(cache).forEach(function(k){
      if(now - cache[k].ts > CACHE_TTL) delete cache[k];
    });
    var keys = Object.keys(cache);
    if(keys.length >= 50){
      keys.sort(function(a,b){ return cache[a].ts - cache[b].ts; });
      keys.slice(0, keys.length - 49).forEach(function(k){ delete cache[k]; });
    }
    cache[query.trim().toLowerCase()] = {ts: now, data: results};
    localStorage.setItem('agent3_search_cache', JSON.stringify(cache));
  } catch(e){}
}

// 知识库时效性检查
var _kbFreshness = {daysSinceUpdate: null, isStale: false, warning: ''};

function checkKnowledgeFreshness(kb){
  try {
    var lastUpdate = kb.lastUpdated;
    if(!lastUpdate) return;
    var daysSince = Math.floor((Date.now() - new Date(lastUpdate).getTime()) / 86400000);
    _kbFreshness.daysSinceUpdate = daysSince;
    if(daysSince > 90){
      _kbFreshness.isStale = true;
      _kbFreshness.warning = '\n\n⚠️⚠️ 【知识库严重过时警告】知识库已' + daysSince + '天未更新（上次：' + lastUpdate + '）。涉及政策、市场数据、竞品动态的回答可能严重过时。回答中涉及此类信息时，必须开头声明"知识库数据截至' + lastUpdate + '，以下信息可能已过时"。\n';
    } else if(daysSince > 30){
      _kbFreshness.isStale = true;
      _kbFreshness.warning = '\n\n⚠️ 【知识库过时提醒】知识库已' + daysSince + '天未更新（上次：' + lastUpdate + '）。涉及政策、市场数据的回答请提醒用户核实时效性。\n';
    } else {
      _kbFreshness.isStale = false;
      _kbFreshness.warning = '';
    }
  } catch(e){ _kbFreshness.warning = ''; }
}

	// ====== 系统提示词（行为规则部分 - 不常变） ======
	const PROMPT_RULES = `
	===== 联网搜索失败处理规则（重要！）=====
	当联网搜索（SerpAPI百度引擎）未能获取有效信息时：
	1. 先坦诚说"本次联网搜索未获取到实时信息"
	2. 基于知识库给出你能提供的最好答案
	3. 最后给出手动搜索建议——包括具体的百度搜索链接。格式：
	   📎 建议手动搜索：
	   - [百度：关键词](https://www.baidu.com/s?wd=URL编码关键词)
	   - [行业参考网站](URL)
	   每个建议必须是可点击的超链接
	4. "最近"默认指近1-3个月。如果知识库数据不是近3个月的，必须提醒用户

	===== 回答格式（面向研发人员）=====
	1. 先用一句话给结论（直接回答问题）
	2. 涉及产品/零部件时，标注型号、规格、技术参数（如果知识库中有）
	3. 标注来源：[知识库] / [联网搜索] / [通用知识] / [手动建议]

	async function loadKnowledgeBase(){
	 try {
	  var resp = await fetch('knowledge_base.json');
	  if(!resp.ok) throw new Error('HTTP ' + resp.status);
	  var kb = await resp.json();
	  // v3.4: 构建信源白名单 + 时效性检查
	  buildTrustedDomains(kb);
	  checkKnowledgeFreshness(kb);
	  SYSTEM_PROMPT = buildKnowledgeText(kb) + _kbFreshness.warning + PROMPT_RULES;
	  // 更新消息列表中的系统提示词
	  if(messages.length > 0 && messages[0].role === 'system'){
	   messages[0].content = SYSTEM_PROMPT;
	  }
	  var updateTime = kb.lastUpdated || '未知';
	  console.log('知识库已加载 (v' + (kb.version||'?') + ', 更新于' + updateTime + ', 白名单' + _trustedDomains.length + '条, 距今' + (_kbFreshness.daysSinceUpdate||'?') + '天)');
	  // v3.4: 如果知识库过期，在页面顶部显示提醒
	  if(_kbFreshness.isStale){
	   showFreshnessBanner();
	  }
	 } catch(e){
	  console.warn('知识库加载失败，使用兜底提示词：' + e.message);
	  SYSTEM_PROMPT = FALLBACK_PROMPT;
	  if(messages.length > 0 && messages[0].role === 'system'){
	   messages[0].content = SYSTEM_PROMPT;
	  }
	 }
	}

	// v3.4: 知识库过期页面顶部提醒
	function showFreshnessBanner(){
	 var existing = document.getElementById('freshness-banner');
	 if(existing) existing.remove();
	 var days = _kbFreshness.daysSinceUpdate;
	 if(!_kbFreshness.isStale || !days) return;
	 var severity = days > 90 ? '严重' : '';
	 var color = days > 90 ? '#dc2626' : '#b45309';
	 var banner = document.createElement('div');
	 banner.id = 'freshness-banner';
	 banner.style.cssText = 'background:'+color+';color:#fff;text-align:center;padding:6px 16px;font-size:13px;font-weight:600;flex-shrink:0;cursor:pointer';

	 banner.onclick = function(){ window.open('https://github.com/Elvv11/churui-agent/blob/master/knowledge_base_SOP.md','_blank'); };
	 var topbar = document.querySelector('.topbar');
	 if(topbar) topbar.parentNode.insertBefore(banner, topbar);
	}

	// 页面初始化：先用兜底提示词，loadKnowledgeBase() 完成后自动替换
	SYSTEM_PROMPT = FALLBACK_PROMPT;

async function supabasePost(data){
 const resp = await fetch(SUPABASE_URL + '/rest/v1/agent_data', {
  method: 'POST',
  headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Prefer': 'return=minimal' },
  body: JSON.stringify(data)
 });
 return resp.ok;
}

async function supabaseGet(params){
 const qs = new URLSearchParams(params).toString();
 const resp = await fetch(SUPABASE_URL + '/rest/v1/agent_data?' + qs, {
  headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
 });
 if(!resp.ok) return [];
 return resp.json();
}

async function supabasePatch(id, data){
	 const resp = await fetch(SUPABASE_URL + '/rest/v1/agent_data?id=eq.' + encodeURIComponent(id), {
	  method: 'PATCH',
	  headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Prefer': 'return=minimal' },
	  body: JSON.stringify(data)
	 });
	 return resp.ok;
}

async function supabaseDelete(id){
	 const resp = await fetch(SUPABASE_URL + '/rest/v1/agent_data?id=eq.' + encodeURIComponent(id), {
	  method: 'DELETE',
	  headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
	 });
	 return resp.ok;
}

let _allFacts = [];
let _currentFilter = '全部';

async function loadSharedFacts(category){
	 if(!userName) return;
	 if(!category) category = _currentFilter;
	 _currentFilter = category;
	 try {
	  var allFacts = await supabaseGet({ data_type: 'eq.fact', order: 'created_at.desc', limit: '200' });
	  _allFacts = allFacts;
	  // 按分类筛选
		  // 过滤掉已删除的
	  var facts = category === '全部' ? allFacts : allFacts.filter(function(f){
	   var c = f.content || {};
	   return c.category === category;
	  });
		  // 过滤已删除的知识
		  facts = facts.filter(function(f){ var c = f.content || {}; return c.status !== 'deleted'; });
	  facts = facts.slice(0, 30);

	  var sf=document.getElementById('stat-facts'); if(sf) sf.textContent = facts.length > 0 ? '+' + facts.length : '-';
	  document.getElementById('fact-list').innerHTML = facts.length > 0
	   ? facts.map(function(f){
	    var c = f.content || {};
	    var cat = c.category || '其他';
	    var colors = {'产品':'#4f46e5','竞品':'#b45309','客户':'#059669','零部件':'#0891b2','政策':'#dc2626','其他':'#9ca3af'};
	    var catColor = colors[cat] || '#9ca3af';
		    var statusIcon = c.status === 'verified' ? ' ' : '';
		    return '<div class="fact-item"><span class="who">'+f.user_name+'</span> <span style="font-size:9px;background:'+catColor+';color:#fff;padding:1px 5px;border-radius:8px;margin-right:3px">'+cat+'</span>'+statusIcon+' '+(c.text||'').slice(0,120)
		     + '<span style="float:right;cursor:pointer;opacity:0.5" title="确认" onclick="event.stopPropagation();verifyFact(\''+f.id+'\')"></span>'
		     + '<span style="float:right;cursor:pointer;opacity:0.5;margin-right:4px" title="删除" onclick="event.stopPropagation();deleteFact(\''+f.id+'\')">❌</span>'
		     + '</div>';
	   }).join('')
	   : '<div class="fact-item" style="color:#9ca3af">暂无此类知识<br>切换分类或开始提问</div>';

	  // 统计用户数
	  var userList = await supabaseGet({ select: 'user_name', order: 'created_at.desc', limit: '500' });
	  var users = [...new Set(userList.map(function(u){return u.user_name;}).filter(Boolean))];
	  var su=document.getElementById('stat-users'); if(su) su.textContent = users.length > 0 ? users.length + '人' : '-'; loadHistory();
	 } catch(e){ console.error(e); }
}

function filterFacts(cat, el){
	 document.querySelectorAll('.cat-tag').forEach(function(t){ t.style.background='#f1f5f9'; t.style.color='#475569'; });
	 el.style.background='#4f46e5'; el.style.color='#fff';
	 loadSharedFacts(cat);
}

async function verifyFact(id){
	 var ok = await supabasePatch(id, { content: _allFacts.find(function(f){return f.id===parseInt(id);}).content });
	 // Actually we need to update just the status field
	 // Simpler approach: re-fetch and find the fact
	 var fact = _allFacts.find(function(f){ return f.id == id; });
	 if(!fact) return;
	 var c = fact.content || {};
	 c.status = 'verified';
	 await supabasePatch(id, { content: c });
	 fact.content = c;
	 loadSharedFacts();
}

async function deleteFact(id){
	 if(!confirm('确定删除这条知识吗？')) return;
	 await supabaseDelete(id);
	 _allFacts = _allFacts.filter(function(f){ return f.id != id; });
	 loadSharedFacts();
}

function classifyFact(text){
 // 根据内容关键词自动判断知识类别
 var t = text.toLowerCase();
 // 政策类
 if(/政策|补贴|大基金|长臂管辖|制裁|关税|工信部|发改委|国务院|FDPR|出口管制|国产替代政策/.test(t)) return '政策';
 // 竞品类
 if(/路远|易通|木几|ASM|松下|富士|雅马哈|西门子|THK|NSK|安川|发那科|海德汉|雷尼绍|基恩士|SMC|Festo|自研率|市占|对标|竞品/.test(t)) return '竞品';
 // 客户类
 if(/华为|烽火|海康|大华|纽威|先导|迈为|汇川|联影|海天|比亚迪|富士康|格力|TCL|美的|欧普|立讯|客户|采购/.test(t)) return '客户';
 // 产品类
 if(/CR15|C15-ME|C20-ME|滑块|CR系列|CRQ|CD系列|CDC|花键|丝杆|磁栅|编码盘|滑环|磁环|直线电机|空心杯|贴头|模组|楚瑞/.test(t)) return '产品';
 // 零部件类
 if(/导轨|伺服电机|光栅尺|工业相机|气动|飞达|Feeder|编码器|传感器|丝杠|轴承|联轴器|减速器|驱动器|变频器|PLC/.test(t)) return '零部件';
 return '其他';
}

	 ];

	 var LEARN_REGEX = new RegExp('[^。！？\\n]{15,}(?:' + LEARN_KEYWORDS.join('|') + ')[^。！？\\n]{5,}', 'g');
	 var keySentences = answer.match(LEARN_REGEX);

function renderMarkdown(text){
	 // 先做基础转义
	 text = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

	 // 处理 markdown 表格 → HTML 表格
	 text = text.replace(/(?:^\|?.+\|$\n?)+/gm, function(tableBlock){
	  var lines = tableBlock.trim().split('\n');
	  if(lines.length < 2) return tableBlock;
          // 第二行必须是分隔行（由 |、-、:、空格组成），否则不是表格
          var sepCheck = lines[1].replace(/\s/g,'');
          if(!/^[\|:]?[-:\|]+$/.test(sepCheck)) return tableBlock;
	  var html = '<table style="border-collapse:collapse;width:100%;margin:8px 0;font-size:13px">';
	  var headerCells = lines[0].split('|').filter(function(c){ return c.trim() !== ''; });
	  html += '<thead><tr style="background:#eef2ff">';
	  headerCells.forEach(function(cell){
	   html += '<th style="border:1px solid #e2e8f0;padding:6px 10px;text-align:left;color:#4f46e5">' + cell.trim() + '</th>';
	  });
	  html += '</tr></thead><tbody>';
	  for(var i = 2; i < lines.length; i++){
	   var cells = lines[i].split('|').filter(function(c){ return c.trim() !== ''; });
	   if(cells.length === 0) continue;
	   html += '<tr style="background:#fff">';
	   cells.forEach(function(cell, ci){
	    html += '<td style="border:1px solid #e2e8f0;padding:6px 10px;' + (ci===0?'font-weight:600;color:#1e293b':'color:#475569') + '">' + cell.trim() + '</td>';
	   });
	   html += '</tr>';
	  }
	  html += '</tbody></table>';
	  return html;
	 });

	 // markdown 链接 [文字](URL) → 可点击超链接
	 text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" style="color:#4f46e5;text-decoration:underline">$1</a>');

	 // 标题和加粗
	 text = text.replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^### (.+)$/gm,'<h3>$1</h3>')
	  .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');

	 // 处理搜索来源角标 [1][2] → 可点击上标链接
	 if(window._lastSearchSources && window._lastSearchSources.length > 0){
	  window._lastSearchSources.forEach(function(src){
	   text = text.replace(new RegExp('\\['+src.num+'\\]','g'),
	    '<sup><a href="'+src.url+'" target="_blank" title="'+src.title.replace(/"/g,'&quot;')+(src.credibility&&src.credibility.label?' ['+src.credibility.label+']':'')+'" style="color:'+(src.credibility&&src.credibility.color?src.credibility.color:'#4f46e5')+';text-decoration:none;font-weight:700;border-bottom:2px solid '+(src.credibility&&src.credibility.color?src.credibility.color:'#4f46e5')+'">['+src.num+']</a></sup>');
	  });
	 }

	 return text.replace(/\n/g,'<br>');
	}

	  const chatResp = await fetch('https://churuiagent.netlify.app/.netlify/functions/chat', {

	  if(!chatResp.ok){ const err = await chatResp.json().catch(()=>({})); throw new Error(err.error||'AI请求失败('+chatResp.status+')'); }

 } catch(e){

	}

var _historyCache = [];

function loadHistory(filter){
 var allChats = [];
 supabaseGet({ data_type: 'eq.chat', order: 'created_at.desc', limit: '200' }).then(function(chats){
  allChats = chats;
  if(filter){
   var kw = filter.toLowerCase();
   allChats = allChats.filter(function(c){
    var q = (c.content&&c.content.question||'').toLowerCase();
    var a = (c.content&&c.content.answer||'').toLowerCase();
    return q.indexOf(kw)>=0 || a.indexOf(kw)>=0;
   });
  }
  _historyCache = allChats;
  // 去重：同问题只保留最新
  var seen = {};
  var unique = [];
  allChats.forEach(function(c){
   var q = (c.content&&c.content.question||'').trim();
   if(q && !seen[q]){ seen[q]=true; unique.push(c); }
  });
  unique = unique.slice(0, 50);
  var cats = {'产品':'#4f46e5','竞品':'#b45309','客户':'#059669','零部件':'#0891b2','政策':'#dc2626','其他':'#9ca3af'};
  document.getElementById('history-list').innerHTML = unique.length>0
   ? unique.map(function(c){
    var q = (c.content&&c.content.question||'');
    var summary = (c.content&&c.content.summary)||q.slice(0,30);
    var title = summary.length>35 ? summary.slice(0,35)+'...' : summary;
    var cat = (c.content&&c.content.category)||'其他';
    var cc = cats[cat]||'#9ca3af';
    var qEncoded = q.replace(/\\/g,'\\\\').replace(/'/g,'\\x27').replace(/"/g,'\\x22');
    return '<div class="history-item" onclick="reAsk(this)" data-question="'+qEncoded+'"><div class="hi-title">'+title+'</div><div class="hi-meta"><span>'+c.user_name+'</span><span style="color:'+cc+'">'+cat+'</span></div></div>';
   }).join('')
   : '<div style="font-size:11px;color:#9ca3af;padding:8px;text-align:center">暂无历史对话</div>';
  var sc=document.getElementById('stat-chats'); if(sc) sc.textContent = unique.length;
 }).catch(function(){});
}
